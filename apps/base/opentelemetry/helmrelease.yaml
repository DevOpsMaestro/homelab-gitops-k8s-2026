---
# OpenTelemetry Collector — vendor-neutral telemetry pipeline.
#
# Role in the observability stack:
#   Istio Envoy sidecars  → (OTLP gRPC)  → OTel Collector → Tempo  (traces)
#   Instrumented apps     → (OTLP)        → OTel Collector → Tempo  (traces)
#   OTel Collector itself → (/metrics)    → Prometheus              (collector health)
#
# No Istio sidecar: the Collector receives plain-text OTLP from Envoy proxies.
# Pods without sidecars are outside mTLS enforcement, so no PeerAuthentication
# exception is needed — Istio auto-detects the destination has no proxy and
# sends plain text.
#
# Receivers: OTLP gRPC (4317), OTLP HTTP (4318)
# Exporters: Tempo via OTLP gRPC
# Self-metrics: chart's built-in service.telemetry.metrics.readers exposes port 8888;
#               a separate prometheus exporter in the pipeline would collide with it.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: opentelemetry-collector
  namespace: flux-system
spec:
  interval: 1h
  driftDetection:
    mode: enabled
  targetNamespace: observability
  dependsOn:
    - name: kube-prometheus-stack
      namespace: flux-system
    - name: tempo
      namespace: flux-system
  install:
    remediation:
      retries: 3
      remediateLastFailure: true
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  chart:
    spec:
      chart: opentelemetry-collector
      version: "0.x"
      sourceRef:
        kind: HelmRepository
        name: open-telemetry
        namespace: flux-system
      interval: 24h
  values:
    mode: deployment

    image:
      repository: otel/opentelemetry-collector-contrib

    podLabels:
      sidecar.istio.io/inject: "false"

    # k8sattributes needs list/watch on pods, namespaces, and replicasets to resolve
    # pod IP → pod metadata and enrich every span with k8s.pod.name,
    # k8s.namespace.name, k8s.deployment.name, etc.
    clusterRole:
      create: true
      rules:
        - apiGroups: [""]
          resources: ["pods", "namespaces"]
          verbs: ["get", "watch", "list"]
        - apiGroups: ["apps"]
          resources: ["replicasets"]
          verbs: ["get", "watch", "list"]

    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi

    # Expose only the ports this cluster uses; disable defaults we don't need.
    ports:
      otlp:
        enabled: true
        containerPort: 4317
        servicePort: 4317
        protocol: TCP
        appProtocol: grpc
      otlp-http:
        enabled: true
        containerPort: 4318
        servicePort: 4318
        protocol: TCP
      metrics:
        enabled: true
        containerPort: 8888
        servicePort: 8888
        protocol: TCP
      jaeger-compact:
        enabled: false
      jaeger-thrift:
        enabled: false
      jaeger-grpc:
        enabled: false
      zipkin:
        enabled: false

    # Provide the collector config via a standalone ConfigMap rather than
    # letting the chart generate it. This bypasses Helm's deep-merge, which
    # cannot null-out the chart's default telemetry.resource inline keys —
    # those keys would coexist with the new attributes array format and cause
    # an OTel validation error in collector ≥0.153.0.
    # The ConfigMap is defined in configmap.yaml; Flux applies it before the
    # HelmRelease so the pod always finds it on startup.
    configMap:
      create: false
      existingName: opentelemetry-collector-config
