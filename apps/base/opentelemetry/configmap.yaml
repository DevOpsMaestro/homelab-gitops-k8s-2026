apiVersion: v1
kind: ConfigMap
metadata:
  name: opentelemetry-collector-config
  namespace: observability
data:
  relay: |
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      memory_limiter:
        check_interval: 5s
        limit_percentage: 80
        spike_limit_percentage: 25
      k8s_attributes:
        auth_type: serviceAccount
        passthrough: false
        extract:
          metadata:
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.deployment.name
            - k8s.namespace.name
            - k8s.node.name
            - k8s.pod.start_time
        pod_association:
          - sources:
              - from: resource_attribute
                name: k8s.pod.ip
          - sources:
              - from: connection
      batch:
        timeout: 1s
        send_batch_size: 512

    exporters:
      otlp_grpc/tempo:
        endpoint: observability-tempo.observability.svc.cluster.local:4317
        tls:
          insecure: true
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 30s
          max_elapsed_time: 300s
        sending_queue:
          enabled: true
          num_consumers: 4
          queue_size: 100

    service:
      extensions: [health_check]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, k8s_attributes, batch]
          exporters: [otlp_grpc/tempo]
      telemetry:
        logs:
          level: warn
        metrics:
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: ${env:MY_POD_IP}
                    port: 8888
        resource:
          attributes:
            - name: host.name
              value: "${env:OTEL_K8S_NODE_NAME}"
            - name: k8s.namespace.name
              value: "${env:OTEL_K8S_NAMESPACE}"
            - name: k8s.node.ip
              value: "${env:OTEL_K8S_NODE_IP}"
            - name: k8s.node.name
              value: "${env:OTEL_K8S_NODE_NAME}"
            - name: k8s.pod.ip
              value: "${env:OTEL_K8S_POD_IP}"
            - name: k8s.pod.name
              value: "${env:OTEL_K8S_POD_NAME}"
